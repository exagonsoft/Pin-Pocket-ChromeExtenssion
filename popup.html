<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title data-i18n="popup.title"></title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="page--popup">
  <div class="app-shell app-shell--popup">
    <header class="brand-banner">
      <div id="user-icon" class="user-icon"></div>
      <div class="brand-header">
        <img src="./icons/branding_logo.png" alt="Pinity Logo" class="brand-logo" />
      </div>
      <p data-i18n="popup.brandDescription"></p>
      <div class="nav-menu">
        <ul class="">
          <li id="nav-menu-pins" class="nav-menu-item-selected" data-i18n="popup.nav.pins">Pins</li>
          <li id="nav-menu-profile" class="nav-menu-item" data-i18n="popup.nav.profile">Profile</li>
          <li id="nav-menu-settings" class="nav-menu-item" data-i18n="popup.nav.settings">Settings</li>
        </ul>
      </div>
    </header>

    <main class="app-main">
      <div class="stack">
        <div>
          <h3 class="section-title" data-i18n="popup.sectionTitle">Your pinned pages</h3>
          <p id="email" class="muted-text" data-i18n="popup.emailChecking">Checking session...</p>
        </div>

        <div class="toolbar">
          <div class="toolbar__row">
            <button id="pin-current" class="button-primary" data-i18n="popup.pinCurrent">Pin current tab</button>
            <button id="reimport-button" class="button-muted" data-i18n="popup.importPinned">Import pinned tabs</button>
          </div>

          <!-- Team management (ONLY for paying owner) -->
          <div class="toolbar__row toolbar__row--end hidden" id="manage-team-section">
            <a href="manageTeam.html" target="_blank" class="link-inline" data-i18n="popup.manageTeam">Manage team</a>
          </div>
        </div>

        <div id="list-container" class="panel">
          <header>
            <h4 data-i18n="popup.savedLinksTitle">Saved links</h4>
            <p data-i18n="popup.savedLinksDesc">Newest pins appear first.</p>
            <!-- 🔍 Pin filter -->
            <div class="" style="margin-top: 10px;">
              <label class="field">
                <input type="search" id="pin-filter" class="full-width" placeholder=""
                  data-i18n-placeholder="popup.filterPlaceholder" autocomplete="off" />
              </label>
            </div>
          </header>

          <ul id="pageList" class="list"></ul>

          <div id="import-spinner" class="hidden" aria-hidden="true">
            <div class="loader"></div>
          </div>
        </div>

        <button id="logout-button" class="button-danger" data-i18n="popup.logout">Log out</button>
      </div>
    </main>
  </div>
  <!-- Global Loader -->
  <div id="global-loader" class="loader-backdrop hidden">
    <div class="loader-modal">
      <div class="loader-spinner"></div>
      <p id="loader-text" data-i18n="popup.loaderText">Loading…</p>
    </div>
  </div>
  <div class="pin-tooltip">
    <div class="pin-tooltip__summary" data-i18n-html="popup.tooltipSummary">...</div>
    <div class="pin-tooltip__tags" data-i18n-html="popup.tooltipTags"><span>#tag</span></div>
  </div>


  <div id="toast-root" class="toast-root"></div>
  <script type="module" src="i18n.js"></script>
  <script type="module" src="popup.js"></script>
</body>

</html>
