<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title data-i18n="manageTeam.title"></title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="page page--stacked">
  <div class="app-shell app-shell--narrow">
    <header class="brand-banner">
      <h1 data-i18n="manageTeam.heading"></h1>
      <p data-i18n="manageTeam.desc"></p>
    </header>

    <main class="app-main">
      <div class="stack">
        <section class="settings-section">
          <header>
            <h4 data-i18n="manageTeam.create.title"></h4>
            <p data-i18n="manageTeam.create.desc"></p>
          </header>
          <div class="field-group">
            <label class="field" for="newTeamName">
              <span data-i18n="manageTeam.fields.teamName"></span>
              <input type="text" id="newTeamName" placeholder="" data-i18n-placeholder="manageTeam.placeholders.teamName" />
            </label>
            <button id="createTeam" class="button-primary" data-i18n="manageTeam.create.action"></button>
          </div>
        </section>

        <section class="settings-section">
          <header>
            <h4 data-i18n="manageTeam.select.title"></h4>
            <p data-i18n="manageTeam.select.desc"></p>
          </header>
          <label class="field" for="teamSelector">
            <span data-i18n="manageTeam.fields.activeTeam"></span>
            <select id="teamSelector">
              <option value="" data-i18n="manageTeam.select.placeholder"></option>
            </select>
          </label>

          <div id="ownerControls" class="panel hidden">
            <header>
              <h4 data-i18n="manageTeam.owner.title"></h4>
              <p data-i18n="manageTeam.owner.desc"></p>
            </header>

            <div class="field-group">
              <label class="field" for="renameInput">
                <span data-i18n="manageTeam.fields.rename"></span>
                <input type="text" id="renameInput" placeholder="" data-i18n-placeholder="manageTeam.placeholders.rename" />
              </label>
              <button id="renameButton" class="button-primary" data-i18n="manageTeam.owner.rename"></button>
              <button id="deleteTeam" class="button-danger" type="button" data-i18n="manageTeam.owner.delete"></button>
            </div>
          </div>
        </section>

        <section class="settings-section">
          <header>
            <h4 data-i18n="manageTeam.invite.title"></h4>
            <p data-i18n="manageTeam.invite.desc"></p>
          </header>
          <form id="inviteForm" class="stack">
            <label class="field" for="inviteEmail">
              <span data-i18n="manageTeam.fields.email"></span>
              <input type="email" id="inviteEmail" placeholder="" data-i18n-placeholder="manageTeam.placeholders.email" required />
            </label>
            <button type="submit" class="button-primary" data-i18n="manageTeam.invite.action"></button>
          </form>
        </section>

        <!-- Pending invites: visible to team owner only, shown via JS -->
        <section class="settings-section hidden" id="pending-invites-section">
          <header>
            <h4 data-i18n="manageTeam.pendingInvites.title"></h4>
            <p data-i18n="manageTeam.pendingInvites.desc"></p>
          </header>
          <ul id="pendingList" class="list"></ul>
        </section>

        <section class="settings-section">
          <header>
            <h4 data-i18n="manageTeam.members.title"></h4>
            <p data-i18n="manageTeam.members.desc"></p>
          </header>
          <ul id="memberList" class="list"></ul>
        </section>
      </div>
    </main>
  </div>
  <div id="toast-root" class="toast-root"></div>
  <script type="module" src="i18n.js"></script>
  <script type="module" src="manageTeam.js"></script>
</body>

</html>
