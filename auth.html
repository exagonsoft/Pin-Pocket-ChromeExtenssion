<!DOCTYPE html>
<html>
<head>
  <title>PinPocket - Auth</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
      width: 300px;
      background-color: #f5f5f5;
    }

    h2 {
      text-align: center;
      margin-bottom: 16px;
    }

    .tab-btns {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .tab-btns button {
      flex: 1;
      padding: 8px;
      border: none;
      background-color: #eee;
      cursor: pointer;
      font-weight: 500;
      border-radius: 4px;
    }

    .tab-btns button.active {
      background-color: #0077cc;
      color: white;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    input {
      display: block;
      width: 100%;
      margin-bottom: 12px;
      padding: 8px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    button[type="submit"] {
      width: 100%;
      background-color: #0077cc;
      color: white;
      font-weight: 600;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button[type="submit"]:hover {
      background-color: #005fa3;
    }
  </style>
</head>
<body>
  <h2>PinPocket</h2>

  <div class="tab-btns">
    <button id="tab-login" class="active">Login</button>
    <button id="tab-register">Register</button>
    <button id="tab-forgot">Forgot?</button>
  </div>

  <form id="login" class="form active">
    <input type="email" id="login-email" placeholder="Email" required />
    <input type="password" id="login-password" placeholder="Password" required />
    <button type="submit">Log In</button>
  </form>

  <form id="register" class="form">
    <input type="text" id="reg-name" placeholder="Name" required />
    <input type="email" id="reg-email" placeholder="Email" required />
    <input type="password" id="reg-password" placeholder="Password" required />
    <button type="submit">Register</button>
  </form>

  <form id="forgot" class="form">
    <input type="email" id="forgot-email" placeholder="Your Email" required />
    <button type="submit">Send Reset Link</button>
  </form>

  <script type="module" src="auth.js"></script>
</body>
</html>
