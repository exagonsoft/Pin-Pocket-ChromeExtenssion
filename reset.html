<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title data-i18n="reset.title"></title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app-shell app-shell--narrow">
    <header class="brand-banner">
      <h1 data-i18n="reset.heading"></h1>
      <p data-i18n="reset.desc"></p>
    </header>

    <main class="app-main">
      <form id="reset-form" class="form active stack">
        <label class="field" for="reset-token">
          <span data-i18n="reset.fields.token"></span>
          <input type="text" id="reset-token" placeholder="" data-i18n-placeholder="reset.placeholders.token" required />
        </label>

        <label class="field" for="new-password">
          <span data-i18n="reset.fields.newPassword"></span>
          <input type="password" id="new-password" placeholder="" data-i18n-placeholder="reset.placeholders.newPassword" required />
        </label>

        <button type="submit" data-i18n="reset.action"></button>
        <a href="auth.html" class="link-inline self-center" data-i18n="reset.back">Back to login</a>
      </form>
    </main>
  </div>
  <div id="toast-root" class="toast-root"></div>
  <script type="module" src="i18n.js"></script>
  <script type="module" src="reset.js"></script>
</body>

</html>
